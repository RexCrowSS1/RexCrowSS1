<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Sayyidina Anshari Ahmad — Full-stack Developer</title>
  <desc id="description">A clean animated profile banner highlighting interface design, maintainable systems, and learning AI fundamentals.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111a"/>
      <stop offset="1" stop-color="#0b1724"/>
    </linearGradient>
    <linearGradient id="nameAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de7ff"/>
      <stop offset="0.55" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#4de7ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4de7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#ff4d8d" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94a3b8" opacity="0.08"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="26"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .drift-one { animation: driftOne 8s ease-in-out infinite; }
    .drift-two { animation: driftTwo 10s ease-in-out infinite; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .moving-line { animation: lineMove 12s linear infinite; }

    @keyframes driftOne {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(0, -6px); }
    }
    @keyframes driftTwo {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(6px, 4px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes lineMove {
      to { stroke-dashoffset: -1100; }
    }

    @media (prefers-reduced-motion: reduce) {
      .drift-one, .drift-two, .pulse, .moving-line { animation: none !important; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle cx="150" cy="35" r="230" fill="url(#cyanGlow)"/>
    <circle cx="1120" cy="300" r="240" fill="url(#pinkGlow)"/>

    <rect x="1" y="1" width="1198" height="318" rx="25" fill="none" stroke="#233244" stroke-width="2"/>
    <path d="M28 1 H322" stroke="url(#nameAccent)" stroke-width="3"/>

    <g transform="translate(62 52)">
      <rect width="126" height="27" rx="13.5" fill="#0d2230" stroke="#24465a"/>
      <circle class="pulse" cx="15" cy="13.5" r="4" fill="#4de7ff"/>
      <text x="28" y="18" class="mono" fill="#a8dcea" font-size="12" font-weight="700">@RexCrowSS1</text>
    </g>

    <text x="60" y="139" class="sans" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="-1.7">Sayyidina</text>
    <text x="60" y="201" class="sans" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="-1.7">Anshari Ahmad</text>
    <rect x="61" y="215" width="208" height="4" rx="2" fill="url(#nameAccent)"/>

    <text x="60" y="254" class="sans" fill="#b7c4d3" font-size="17">Full-stack developer building clear interfaces and dependable web systems.</text>

    <g transform="translate(60 278)">
      <rect width="97" height="24" rx="12" fill="#4de7ff" fill-opacity="0.1" stroke="#4de7ff" stroke-opacity="0.45"/>
      <text x="13" y="16" class="mono" fill="#8cefff" font-size="11" font-weight="700">CLEAN UI</text>

      <rect x="108" width="126" height="24" rx="12" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-opacity="0.45"/>
      <text x="121" y="16" class="mono" fill="#75df9a" font-size="11" font-weight="700">WEB SYSTEMS</text>

      <rect x="245" width="112" height="24" rx="12" fill="#ff4d8d" fill-opacity="0.1" stroke="#ff4d8d" stroke-opacity="0.45"/>
      <text x="258" y="16" class="mono" fill="#ff8eb6" font-size="11" font-weight="700">LEARNING AI</text>
    </g>

    <g transform="translate(756 48)">
      <rect width="380" height="224" rx="22" fill="#091520" stroke="#26384a"/>

      <text x="28" y="37" class="mono" fill="#708196" font-size="11" font-weight="700" letter-spacing="1.8">WHAT I CARE ABOUT</text>
      <path d="M28 53 H352" stroke="#203142"/>

      <g transform="translate(28 75)">
        <rect width="5" height="42" rx="2.5" fill="#4de7ff"/>
        <text x="22" y="16" class="sans" fill="#f1f5f9" font-size="15" font-weight="700">Interface</text>
        <text x="22" y="37" class="sans" fill="#91a2b5" font-size="13">Clear, responsive, intentional</text>
      </g>

      <g transform="translate(28 128)">
        <rect width="5" height="42" rx="2.5" fill="#22c55e"/>
        <text x="22" y="16" class="sans" fill="#f1f5f9" font-size="15" font-weight="700">Systems</text>
        <text x="22" y="37" class="sans" fill="#91a2b5" font-size="13">Readable and maintainable</text>
      </g>

      <g transform="translate(28 181)">
        <rect width="5" height="24" rx="2.5" fill="#ff4d8d"/>
        <text x="22" y="16" class="sans" fill="#f1f5f9" font-size="15" font-weight="700">Learning AI fundamentals</text>
      </g>
    </g>

    <g class="drift-one">
      <rect x="1113" y="25" width="11" height="11" rx="3" fill="#4de7ff"/>
      <rect x="1137" y="38" width="7" height="7" rx="2" fill="#22c55e"/>
    </g>

    <g class="drift-two">
      <circle cx="720" cy="70" r="5" fill="#ff4d8d"/>
      <circle cx="699" cy="54" r="3" fill="#facc15"/>
    </g>

    <path d="M60 311 H1140" fill="none" stroke="#1e3040" stroke-width="2"/>
    <path class="moving-line" d="M60 311 H1140" fill="none" stroke="url(#nameAccent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="90 990"/>
  </g>
</svg>
