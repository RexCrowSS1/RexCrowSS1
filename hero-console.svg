<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Sayyidina Anshari Ahmad — Full-stack Developer</title>
  <desc id="description">An animated developer console with Sayyidina's role, focus, and current interest in artificial intelligence.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061019"/>
      <stop offset="0.55" stop-color="#081c2c"/>
      <stop offset="1" stop-color="#102438"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4de7ff"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#4de7ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4de7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink">
      <stop offset="0" stop-color="#ff4d8d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff4d8d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#4de7ff" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .scan { animation: scan 7s linear infinite; }
    .blink { animation: blink 1.05s steps(1, end) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
    .float-a { animation: floatA 5s ease-in-out infinite; }
    .float-b { animation: floatB 6.5s ease-in-out infinite; }
    .dash { animation: dash 9s linear infinite; }
    .pacman { animation: pacmanRun 5.5s ease-in-out infinite alternate; }
    .mouth { animation: chomp 0.28s ease-in-out infinite alternate; transform-origin: 12px 12px; }

    @keyframes scan {
      from { transform: translateY(-40px); }
      to { transform: translateY(420px); }
    }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes floatA { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -9px); } }
    @keyframes floatB { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(7px, 5px); } }
    @keyframes dash { to { stroke-dashoffset: -140; } }
    @keyframes pacmanRun { from { transform: translateX(0); } to { transform: translateX(186px); } }
    @keyframes chomp { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }

    @media (prefers-reduced-motion: reduce) {
      .scan, .blink, .pulse, .float-a, .float-b, .dash, .pacman, .mouth { animation: none !important; }
    }
  </style>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="185" cy="85" r="230" fill="url(#glowCyan)"/>
    <circle cx="1080" cy="305" r="260" fill="url(#glowPink)"/>

    <g class="scan" opacity="0.25">
      <rect x="0" y="0" width="1200" height="2" fill="url(#accent)"/>
      <rect x="0" y="2" width="1200" height="24" fill="url(#accent)" opacity="0.06"/>
    </g>

    <rect x="1.5" y="1.5" width="1197" height="357" rx="26.5" fill="none" stroke="url(#accent)" stroke-width="3"/>

    <g transform="translate(32 30)">
      <circle cx="0" cy="0" r="6" fill="#ff4d8d"/>
      <circle cx="22" cy="0" r="6" fill="#facc15"/>
      <circle cx="44" cy="0" r="6" fill="#22c55e"/>
      <text x="73" y="5" class="mono" fill="#64748b" font-size="13" letter-spacing="1.8">PROFILE.EXE</text>
    </g>

    <g class="float-a" transform="translate(74 88)">
      <rect width="108" height="29" rx="14.5" fill="#4de7ff" fill-opacity="0.1" stroke="#4de7ff" stroke-opacity="0.5"/>
      <circle class="pulse" cx="16" cy="14.5" r="4" fill="#22c55e" filter="url(#softGlow)"/>
      <text x="29" y="19" class="mono" fill="#9befff" font-size="12" font-weight="700" letter-spacing="1.2">PLAYER 01</text>
    </g>

    <text x="72" y="154" class="sans" fill="#f8fafc" font-size="48" font-weight="800" letter-spacing="-1.4">SAYYIDINA ANSHARI</text>
    <text x="70" y="218" class="sans" fill="url(#accent)" font-size="70" font-weight="900" letter-spacing="-2">AHMAD</text>

    <text x="74" y="257" class="mono" fill="#94a3b8" font-size="15" letter-spacing="1.6">FULL-STACK DEVELOPER  /  CLEAN UI  /  RELIABLE SYSTEMS</text>
    <text x="74" y="294" class="mono" fill="#e2e8f0" font-size="16">I build clear, fast web products</text>
    <rect class="blink" x="391" y="279" width="10" height="19" rx="1" fill="#4de7ff"/>

    <g class="float-b">
      <rect x="773" y="68" width="357" height="225" rx="22" fill="#08131f" fill-opacity="0.86" stroke="#263a4b"/>
      <rect class="dash" x="773" y="68" width="357" height="225" rx="22" fill="none" stroke="url(#accent)" stroke-opacity="0.65" stroke-width="2" stroke-dasharray="9 13"/>

      <text x="802" y="105" class="mono" fill="#64748b" font-size="12" font-weight="700" letter-spacing="2">CURRENT MODE</text>

      <circle cx="805" cy="137" r="5" fill="#4de7ff"/>
      <text x="822" y="142" class="mono" fill="#cbd5e1" font-size="14">BUILD</text>
      <text x="920" y="142" class="mono" fill="#f8fafc" font-size="14" font-weight="700">FAST WEB APPS</text>

      <circle cx="805" cy="172" r="5" fill="#22c55e"/>
      <text x="822" y="177" class="mono" fill="#cbd5e1" font-size="14">REFINE</text>
      <text x="920" y="177" class="mono" fill="#f8fafc" font-size="14" font-weight="700">UI DETAILS</text>

      <circle cx="805" cy="207" r="5" fill="#ff4d8d"/>
      <text x="822" y="212" class="mono" fill="#cbd5e1" font-size="14">LEARN</text>
      <text x="920" y="212" class="mono" fill="#f8fafc" font-size="14" font-weight="700">PRACTICAL AI</text>

      <g transform="translate(801 246)">
        <circle cx="48" cy="12" r="3.2" fill="#facc15" opacity="0.5"/>
        <circle cx="88" cy="12" r="3.2" fill="#facc15" opacity="0.65"/>
        <circle cx="128" cy="12" r="3.2" fill="#facc15" opacity="0.8"/>
        <circle cx="168" cy="12" r="3.2" fill="#facc15"/>
        <circle cx="208" cy="12" r="3.2" fill="#facc15" opacity="0.8"/>
        <circle cx="248" cy="12" r="3.2" fill="#facc15" opacity="0.65"/>

        <g class="pacman">
          <circle cx="12" cy="12" r="12" fill="#facc15"/>
          <g class="mouth">
            <path d="M12 12 L25 4 L25 20 Z" fill="#08131f"/>
          </g>
          <circle cx="13" cy="6" r="1.6" fill="#061019"/>
        </g>
      </g>
    </g>

    <g class="float-a" opacity="0.85">
      <rect x="1120" y="28" width="13" height="13" rx="3" fill="#4de7ff"/>
      <rect x="1145" y="48" width="8" height="8" rx="2" fill="#22c55e"/>
      <rect x="1093" y="43" width="7" height="7" rx="2" fill="#ff4d8d"/>
    </g>

    <g class="float-b" opacity="0.7">
      <path d="M1062 322 h44" stroke="#4de7ff" stroke-width="2"/>
      <path d="M1084 300 v44" stroke="#4de7ff" stroke-width="2"/>
      <circle cx="1084" cy="322" r="14" fill="none" stroke="#ff4d8d" stroke-width="2"/>
    </g>

    <text x="74" y="334" class="mono" fill="#64748b" font-size="11" letter-spacing="2.2">PRESS START  →  SCROLL TO EXPLORE</text>
  </g>
</svg>
